<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mounika ❤️</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
font-family:Arial,sans-serif;text-align:center;color:white;overflow:hidden;
background:linear-gradient(135deg,#ff4f81,#ff7eb3,#a18cd1)
}
.card{
width:90%;max-width:650px;padding:45px 25px;border-radius:30px;
background:rgba(255,255,255,.2);backdrop-filter:blur(12px);
box-shadow:0 20px 50px rgba(0,0,0,.25)
}
.heart{font-size:75px;animation:beat 1s infinite}
h1{font-size:45px;margin:15px}
p{font-size:20px;line-height:1.6}
.message{padding:20px;border-radius:20px;background:rgba(255,255,255,.15)}
button{padding:14px 28px;border:0;border-radius:30px;font-size:18px;color:#ff4f81}
.falling{position:fixed;top:-30px;font-size:25px;animation:fall 6s linear infinite}
@keyframes beat{50%{transform:scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
<div class="heart">❤️</div>
<h1>Mounika</h1>
<p>Welcome to your special page ✨</p>

<div class="message">
<p>Some people make life beautiful just by being there. ❤️</p>
<p>This little page is made especially for you. 🌸</p>
</div>

<button onclick="alert('You are special ❤️')">Click Me 💕</button>
</div>

<script>
for(let i=0;i<25;i++){
let h=document.createElement("div");
h.className="falling";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
h.style.animationDelay=Math.random()*6+"s";
h.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(h);
}
</script>

</body>
</html>
