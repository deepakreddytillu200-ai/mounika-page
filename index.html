<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mounika ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff4f8b,#ff9ac2,#ffd1e3);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:650px;
  padding:40px 25px;
  text-align:center;
  color:white;
  background:rgba(255,255,255,.25);
  border-radius:30px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.big-heart{
  font-size:75px;
  animation:beat 1s infinite;
}

h1{
  font-size:55px;
  margin:10px;
}

h2{font-size:25px}

p{
  font-size:19px;
  line-height:1.6;
}

.photo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid white;
  margin:15px;
}

button{
  padding:14px 25px;
  margin:7px;
  border:0;
  border-radius:35px;
  background:white;
  color:#e83e7d;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
  z-index:10;
}

.popup-box{
  width:90%;
  max-width:430px;
  padding:30px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#ff6fa5,#ffb6d5);
  border-radius:30px;
  box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.popup-box img{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
}

.heart{
  position:fixed;
  bottom:-50px;
  font-size:30px;
  animation:float 4s linear forwards;
  pointer-events:none;
  z-index:20;
}

@keyframes beat{
  50%{transform:scale(1.2)}
}

@keyframes float{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div class="card">

  <div class="big-heart">❤️</div>

  <h1>Mounika</h1>

  <h2>Welcome to your special page ✨</h2>

  <img
    class="photo"
    src="WhatsApp Image 2026-08-26 at 3.00.42 AM.jpeg"
    alt="Mounika">

  <p>
    normal gaa ipo kadha enka apduu cheyanu kadha. ❤️
    <br>
    sare ne istam ok option click cheyu ne ans final enka. 🌸
  </p>

  <button onclick="openQuestion()">
    Click Me 💕
  </button>

</div>

<div class="popup" id="question">

  <div class="popup-box">

    <img
      src="WhatsApp Image 2026-08-26 at 3.00.42 AM.jpeg"
      alt="Mounika">

    <h2>Mounika ❤️</h2>

    <p>
      Mounika, natho matladhachuu kadha? 🥹❤️
    </p>

    <button onclick="yesAnswer()">YES ❤️</button>

    <button onclick="noAnswer()">NO 😔</button>

  </div>

</div>

<div class="popup" id="answer">

  <div class="popup-box">

    <div style="font-size:60px;">❤️🥹</div>

    <h2 id="answerText"></h2>

    <button onclick="closePopup()">Close ❤️</button>

  </div>

</div>

<script>

function openQuestion(){
  document.getElementById("question").style.display="flex";
  hearts();
}

function yesAnswer(){
  document.getElementById("question").style.display="none";
  document.getElementById("answer").style.display="flex";
  document.getElementById("answerText").innerHTML="abaa suoer tq mali ela apudu cheyanu ❤️🥹";
  hearts();
}

function noAnswer(){
  document.getElementById("question").style.display="none";
  document.getElementById("answer").style.display="flex";
  document.getElementById("answerText").innerHTML=
    "naku telusuu anduka no iyena yes ani heyy chapuu plz heyy plz❤️🥹";
  hearts();
}

function closePopup(){
  document.getElementById("answer").style.display="none";
}

function hearts(){

  for(let i=0;i<35;i++){

    const heart=document.createElement("div");

    heart.className="heart";

    const emojis=["❤️","💕","💗","💖","💘"];

    heart.innerHTML=
      emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=
      (20+Math.random()*35)+"px";

    heart.style.animationDuration=
      (3+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(function(){
      heart.remove();
    },6000);
  }
}

</script>

</body>
</html>
