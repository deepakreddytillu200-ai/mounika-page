<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mounika ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

.card {
    width: 90%;
    max-width: 650px;
    padding: 45px 25px;
    border-radius: 30px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.heart {
    font-size: 70px;
    animation: beat 1s infinite;
}

h1 {
    font-size: 42px;
    margin: 15px 0;
}

p {
    font-size: 20px;
    line-height: 1.6;
}

.message {
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

button {
    margin-top: 25px;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
}
</style>
</head>

<body>

<div class="card">

    <div class="heart">❤️</div>

    <h1>Mounika</h1>

    <p>Welcome to your special page ✨</p>

    <div class="message">
        <p>
            Some people make life beautiful  
            just by being there. ❤️
        </p>
        <p>
            This little page is made especially for you. 🌸
        </p>
    </div>

    <button onclick="alert('You are special ❤️')">
        Click Me 💕
    </button>

</div>

</body>
</html>
