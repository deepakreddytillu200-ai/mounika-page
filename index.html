<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mounika ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff4f8b,#ff9ac2,#ffd1e3);
  overflow:hidden;
}

.card{
  width:90%;
  max-width:650px;
  padding:40px 25px;
  text-align:center;
  color:white;
  background:rgba(255,255,255,.25);
  border-radius:30px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.big-heart{
  font-size:75px;
  animation:beat 1s infinite;
}

h1{
  font-size:55px;
  margin:10px;
}

h2{
  font-size:25px;
}

p{
  font-size:19px;
  line-height:1.6;
}

.photo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid white;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  margin:15px;
}

button{
  padding:16px 32px;
  border:0;
  border-radius:35px;
  background:white;
  color:#e83e7d;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
  z-index:10;
}

.popup-box{
  width:90%;
  max-width:430px;
  padding:30px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#ff6fa5,#ffb6d5);
  border-radius:30px;
  box-shadow:0 20px 70px rgba(0,0,0,.4);
  animation:pop .5s ease;
}

.popup-box img{
  width:190px;
  height:190px;
  object-fit:cover;
  border-radius:50%;
  border:6px solid white;
}

.popup-box h2{
  font-size:32px;
}

.close{
  margin-top:10px;
}

.heart{
  position:fixed;
  bottom:-50px;
  font-size:30px;
  pointer-events:none;
  animation:float 4s linear forwards;
  z-index:20;
}

@keyframes beat{
  50%{transform:scale(1.2)}
}

@keyframes pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

@keyframes float{
  0%{
    transform:translateY(0) rotate(0);
    opacity:1;
  }
  100%{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="big-heart">❤️</div>

  <h1>Mounika</h1>

  <h2>Welcome to your special page ✨</h2>

  <img
    class="photo"
    src="WhatsApp Image 2026-08-26 at 3.00.42 AM.jpeg"
    alt="Mounika">

  <p>
    Some people make life beautiful just by being there. ❤️
    <br>
    This little page is made especially for you. 🌸
  </p>

  <button onclick="openSurprise()">
    Click Me 💕
  </button>

</div>

<div class="popup" id="popup">

  <div class="popup-box">

    <img
      src="WhatsApp Image 2026-08-26 at 3.00.42 AM.jpeg"
      alt="Mounika">

    <h2>Mounika ❤️</h2>

    <p>
      You are special to me. 💗
      <br>
      Keep smiling always. 🌸
      <br>
      You deserve all the happiness in the world. 🥹❤️
    </p>

    <button class="close" onclick="closeSurprise()">
      Close ❤️
    </button>

  </div>

</div>

<script>

function openSurprise(){

  document.getElementById("popup").style.display="flex";

  for(let i=0;i<50;i++){
    createHeart();
  }
}

function closeSurprise(){

  document.getElementById("popup").style.display="none";
}

function createHeart(){

  const heart=document.createElement("div");

  heart.className="heart";

  const hearts=["❤️","💕","💗","💖","💘"];

  heart.innerHTML=
    hearts[Math.floor(Math.random()*hearts.length)];

  heart.style.left=Math.random()*100+"vw";

  heart.style.fontSize=
    (20+Math.random()*35)+"px";

  heart.style.animationDuration=
    (3+Math.random()*3)+"s";

  document.body.appendChild(heart);

  setTimeout(function(){
    heart.remove();
  },6000);
}

</script>

</body>
</html>
